<main class="container py-5">
  <div class="page-heading mb-4">
    <span class="eyebrow">EXEMPLO EXTRA</span>
    <h1 class="display-6 fw-bold">Gerenciar participantes</h1>
    <p class="text-secondary">Treino de <code>POST</code>, <code>PUT</code>, <code>PATCH</code> e <code>DELETE</code>. Esta página vai além da prova de referência.</p>
  </div>
  <div id="aviso" role="alert" aria-live="polite"></div>
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 id="tituloForm" class="h4">Novo participante</h2>
          <form id="formParticipante">
            <input type="hidden" id="participanteId">
            <div class="mb-3"><label for="nome" class="form-label">Nome</label><input id="nome" class="form-control" required maxlength="80"></div>
            <div class="mb-3"><label for="estilo" class="form-label">Estilo musical</label><input id="estilo" class="form-control" required maxlength="50"></div>
            <div class="mb-3"><label for="descricao" class="form-label">Descrição</label><textarea id="descricao" class="form-control" rows="3" maxlength="180"></textarea></div>
            <div class="mb-3"><label for="foto" class="form-label">Imagem (arquivo do projeto)</label>
              <select id="foto" class="form-select">
                <option value="img/aurora.svg">Aurora</option>
                <option value="img/batuque.svg">Batuque</option>
                <option value="img/horizonte.svg">Horizonte</option>
                <option value="img/raizes.svg">Raízes</option>
                <option value="img/jazz.svg">Jazz</option>
                <option value="img/urbanas.svg">Urbanas</option>
              </select>
            </div>
            <div class="form-check mb-3"><input id="naRoca" type="checkbox" class="form-check-input"><label for="naRoca" class="form-check-label">Está na berlinda</label></div>
            <button type="submit" id="salvar" class="btn btn-danger w-100">Salvar participante</button>
            <button type="button" id="cancelar" class="btn btn-outline-secondary w-100 mt-2 d-none">Cancelar edição</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 mb-0">Participantes cadastrados</h2><span id="total" class="badge text-bg-secondary">—</span></div>
      <div id="listaAdmin" class="vstack gap-3"></div>
    </div>
  </div>
